name: 打包并发布

# 当推送 v 开头的标签时触发（如 v1.0.0、v1.2.3）
on:
  push:
    tags:
      - 'v*'
  # 也允许手动触发（用于调试，不会发布 Release）
  workflow_dispatch:

permissions:
  contents: write  # 允许创建 Release 和上传附件

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 打包 EXE
        run: python build.py

      - name: 准备发布文件（带版本号的英文名）
        id: prep
        shell: pwsh
        run: |
          # 从标签名提取版本号；手动触发时用 dev
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $version = $env:GITHUB_REF -replace 'refs/tags/', ''
          } else {
            $version = 'dev'
          }
          $src = "dist/文件全能转化助手.exe"
          $dst = "dist/FileConverter-$version.exe"
          Copy-Item $src $dst
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "asset=$dst" >> $env:GITHUB_OUTPUT
          echo "打包产物: $dst"

      - name: 上传构建产物（供手动触发时下载调试）
        uses: actions/upload-artifact@v4
        with:
          name: FileConverter-${{ steps.prep.outputs.version }}
          path: ${{ steps.prep.outputs.asset }}

      - name: 发布到 Release（仅标签触发）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: 文件全能转化助手 ${{ steps.prep.outputs.version }}
          files: ${{ steps.prep.outputs.asset }}
          body: |
            ## 文件全能转化助手 ${{ steps.prep.outputs.version }}

            一款基于 PySide6 的全能文件格式转换桌面工具，开箱即用，无需安装 Python 环境。

            ### 📥 下载
            下载下方的 **FileConverter-${{ steps.prep.outputs.version }}.exe**，双击即可运行（Windows 10/11 64位）。

            ### ✨ 支持的 13 种转换
            - **PDF → Office**：PDF → Word / PPT / Excel
            - **PDF → 图片**：PDF → 长图 / 逐页图片
            - **PDF 处理**：PDF 拆分 / 合并
            - **Office → PDF**：Word / PPT / Excel → PDF
            - **图片处理**：图片 → Word / Excel（OCR 识别）/ PDF

            ### 📝 使用说明
            - **Office → PDF** 功能需本机安装 Microsoft Office
            - **图片 → Word/Excel**（OCR）功能需本机安装 Tesseract OCR（含中文语言包）
            - 首次启动需几秒解压，请耐心等待
